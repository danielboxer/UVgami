[project]
name = "uvgami-dev"
version = "0.1.0"
description = "Dev environment for UVgami: engine CLI, tests and benchmark"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
uvgami = "uvgami_cli.cli:main"

# numpy is imported by the partuv orchestration code under test
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "numpy", "matplotlib"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "dev"
module-name = "uvgami_cli"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.ruff]
target-version = "py311"
# private is its own repo, so the root gitignore does not keep ruff out of it
extend-exclude = ["private", "src/utils/pyqtree.py"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
# pytest skips a testpath that is not there
testpaths = ["dev/tests", "private/bench/tests", "private/engine/partuv/tests"]
markers = ["smoke: runs the real engine binary"]
# the partuv driver source must import for the wheel tests, with no built _core
pythonpath = ["private/engine/partuv", "private/bench/src"]
# the plugin keeps pytest from importing the blender addon root __init__.py
addopts = "--import-mode=importlib -p uvgami_cli._pytest_plugin"
