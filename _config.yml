title: UVgami
description: Automatic UV unwrapping for Blender
theme: jekyll-theme-minimal
# logo: /docs/img/readme/logo.png
show_downloads: true

# the theme's download button points at the source zip
github:
  zip_url: https://github.com/DanielBoxer/UVgami/releases/latest/download/UVgami.zip

# jekyll publishes everything it isn't told to skip, so keep source and agent docs out
exclude:
  - src
  - engine
  - bench
  - tests
  - uvgami_cli
  - docs/agents
  - __init__.py
  - pyproject.toml
  - uv.lock
  - blender_manifest.toml
  - AGENTS.md
  - CLAUDE.md
