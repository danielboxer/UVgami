name: Check version bump

on:
  workflow_call:
    inputs:
      file:
        required: true
        type: string
    outputs:
      bumped:
        value: ${{ jobs.check-version.outputs.bumped }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # the whole push, not just the last commit
      - name: Check for a version bump
        id: check
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=HEAD^
          fi
          if git diff "$BEFORE" HEAD -- ${{ inputs.file }} | grep -qE '^\+version = '; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
