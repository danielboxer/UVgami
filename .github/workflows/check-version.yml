name: Check version bump

on:
  workflow_call:
    inputs:
      file:
        required: true
        type: string
    outputs:
      bumped:
        value: ${{ jobs.check-version.outputs.bumped }}

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a version bump
        id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          FILE: ${{ inputs.file }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=HEAD^
          fi
          if git diff "$BEFORE" HEAD -- "$FILE" | grep -qE '^\+version = '; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
