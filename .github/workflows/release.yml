name: Release

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - blender_manifest.toml

permissions: {}

env:
  ADDON_NAME: "UVgami"

jobs:
  check-version:
    uses: ./.github/workflows/check-version.yml
    permissions:
      contents: read
    with:
      file: blender_manifest.toml

  prepare:
    needs: check-version
    if: needs.check-version.outputs.bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check addon version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' blender_manifest.toml | sed -E 's/version *= *"(.*)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Bump blender_manifest.toml."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    uses: ./.github/workflows/release-check.yml
    permissions:
      contents: read
    secrets:
      ENGINE_RELEASE_TOKEN: ${{ secrets.ENGINE_RELEASE_TOKEN }}
      ENGINE_RELEASE_REPO: ${{ secrets.ENGINE_RELEASE_REPO }}

  package:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # the zip the check installed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addon-zip
      - run: mv addon.zip ${ADDON_NAME}.zip

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ADDON_NAME }}.zip

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" "${ADDON_NAME}.zip" --title "$TAG"

      # the site serves index.json as a blender extension repository
      - name: Update the extension index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/${{ env.ADDON_NAME }}.zip
        run: |
          python dev/write_extension_index.py "${ADDON_NAME}.zip" "$ARCHIVE_URL" index.json
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "update extension index"
          git push
