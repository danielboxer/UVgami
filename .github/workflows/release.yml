name: Release

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - blender_manifest.toml

env:
  ADDON_NAME: "UVgami"
  INCLUDED_FILES: "src LICENSE __init__.py blender_manifest.toml"

jobs:
  check-version:
    uses: ./.github/workflows/check-version.yml
    with:
      file: blender_manifest.toml

  prepare:
    needs: check-version
    if: needs.check-version.outputs.bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Check addon version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' blender_manifest.toml | sed -E 's/version *= *"(.*)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Bump blender_manifest.toml."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  optcuts:
    needs: prepare
    uses: ./.github/workflows/engine-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      engine: optcuts

  xatlas:
    needs: prepare
    uses: ./.github/workflows/engine-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      engine: xatlas

  partuv:
    needs: prepare
    uses: ./.github/workflows/partuv-build.yml
    secrets: inherit
    permissions:
      contents: write

  package:
    needs: [prepare, optcuts, xatlas, partuv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # no engine is bundled, the addon downloads each one from the engine
      # release that the jobs above publish
      - name: Zip the addon
        run: zip -r ${ADDON_NAME}.zip $INCLUDED_FILES

      # partuv bundles PartField, whose license allows non-commercial use only.
      # artifact rather than a release asset, only the zip above is public
      - name: Zip the addon without partuv
        # the trailing * without a slash also drops the directory entry, which
        # python would otherwise import as an empty namespace package
        run: zip -r ${ADDON_NAME}-no-partuv.zip $INCLUDED_FILES -x 'src/engines/partuv*'

      - name: Upload the addon without partuv
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_NAME }}-no-partuv
          path: ${{ env.ADDON_NAME }}-no-partuv.zip

      - name: Determine TAG
        run: echo "TAG=${{ needs.prepare.outputs.tag }}" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: gh release create "$TAG" "${ADDON_NAME}.zip" --title "$TAG"
