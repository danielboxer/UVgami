name: Release

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - blender_manifest.toml

env:
  ADDON_NAME: "UVgami"
  INCLUDED_FILES: "src LICENSE __init__.py blender_manifest.toml"

jobs:
  check-version:
    uses: ./.github/workflows/check-version.yml
    with:
      file: blender_manifest.toml

  prepare:
    needs: check-version
    if: needs.check-version.outputs.bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check addon version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' blender_manifest.toml | sed -E 's/version *= *"(.*)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Bump blender_manifest.toml."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    uses: ./.github/workflows/release-check.yml
    secrets: inherit

  package:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # no engine is bundled, the addon downloads each one
      - name: Zip the addon
        run: zip -r ${ADDON_NAME}.zip $INCLUDED_FILES

      - name: Determine TAG
        run: echo "TAG=${{ needs.prepare.outputs.tag }}" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: gh release create "$TAG" "${ADDON_NAME}.zip" --title "$TAG"

      # the site serves index.json as a blender extension repository
      - name: Update the extension index
        env:
          ARCHIVE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/${{ env.ADDON_NAME }}.zip
        run: |
          python dev/write_extension_index.py "${ADDON_NAME}.zip" "$ARCHIVE_URL" index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "update extension index"
          git push
