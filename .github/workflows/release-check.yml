name: Release check

on:
  workflow_dispatch:
  workflow_call:

env:
  INCLUDED_FILES: "src LICENSE __init__.py blender_manifest.toml"

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download the bundled engine builds
        env:
          GITHUB_TOKEN: ${{ secrets.ENGINE_RELEASE_TOKEN }}
          ENGINE_RELEASE_REPO: ${{ secrets.ENGINE_RELEASE_REPO }}
        run: |
          mkdir -p bin/licenses
          for ENGINE in segment hardsurface; do
            CONSTANT="$(echo "$ENGINE" | tr a-z A-Z)_VERSION"
            VERSION=$(grep -m1 "^$CONSTANT = " src/engines/bundled.py | cut -d'"' -f2)
            gh release download "$ENGINE-v$VERSION" -R "$ENGINE_RELEASE_REPO" --pattern "$ENGINE-engine-$VERSION-*.zip" --dir "package/$ENGINE"
            for TAG in windows linux macos-x64 macos-arm64; do
              BINARY=$ENGINE
              if [ "$TAG" = "windows" ]; then BINARY=$ENGINE.exe; fi
              mkdir -p "extracted/$ENGINE/$TAG" "bin/$TAG"
              unzip -q "package/$ENGINE/$ENGINE-engine-$VERSION-$TAG.zip" -d "extracted/$ENGINE/$TAG"
              cp "$(find "extracted/$ENGINE/$TAG" -type f -name "$BINARY")" "bin/$TAG/"
            done
            cp "$(find "extracted/$ENGINE/linux" -type d -name licenses)"/* bin/licenses/
          done
          cp "$(find extracted/segment/linux -type f -name LICENSE.txt)" bin/

      - run: zip -r addon.zip $INCLUDED_FILES bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: addon-zip
          path: addon.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  smoke:
    strategy:
      fail-fast: false
      matrix:
        engine: [optcuts, xatlas]
        platform:
          - os: ubuntu-latest
            pkg_name: linux
          - os: windows-latest
            pkg_name: windows
          - os: macos-26-intel
            pkg_name: macos-x64
          - os: macos-26
            pkg_name: macos-arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 10
    env:
      ENGINE: ${{ matrix.engine }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # uv refuses macos (tool.uv.environments), and the cli has no dependencies
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download the published zip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # bash 3.2 on the macos runners has no ${ENGINE^^}
          CONSTANT="$(echo "$ENGINE" | tr a-z A-Z)_VERSION"
          VERSION=$(grep -m1 "^$CONSTANT = " src/engines/$ENGINE/install.py | cut -d'"' -f2)
          gh release download "$ENGINE-v$VERSION" --pattern "$ENGINE-engine-*-${{ matrix.platform.pkg_name }}.zip" --dir package

      - name: Check the zip against the pinned sha256
        shell: bash
        run: |
          # windows git bash has no shasum, macos has no sha256sum
          HASH=$(python -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" package/*.zip)
          if ! grep -q "\"${{ matrix.platform.pkg_name }}\": \"$HASH\"" src/engines/$ENGINE/install.py; then
            echo "::error::$ENGINE ${{ matrix.platform.pkg_name }} zip sha256 $HASH is not pinned in install.py"
            exit 1
          fi

      # same basename match as fetch_binary in the addon
      - name: Extract the engine binary
        shell: bash
        run: |
          BINARY=$ENGINE
          if [ "$RUNNER_OS" = "Windows" ]; then BINARY=$ENGINE.exe; fi
          unzip -q package/*.zip -d extracted
          FOUND=$(find extracted -type f -name "$BINARY")
          if [ "$(echo "$FOUND" | grep -c .)" != "1" ]; then
            echo "::error::expected one $BINARY in the zip, found: $FOUND"
            exit 1
          fi
          mkdir -p engine-builds/${{ matrix.platform.pkg_name }}
          cp "$FOUND" engine-builds/${{ matrix.platform.pkg_name }}/
          chmod +x engine-builds/${{ matrix.platform.pkg_name }}/$BINARY

      - name: Unwrap a cube
        shell: bash
        env:
          PYTHONPATH: dev
        run: |
          OUTPUT=$RUNNER_TEMP/cube_uv.obj
          EXTRA=""
          if [ "$ENGINE" = "optcuts" ]; then EXTRA="--timeout 120"; fi
          python -m uvgami_cli unwrap dev/tests/fixtures/cube.obj --engine $ENGINE -o "$OUTPUT" $EXTRA
          grep -q '^vt ' "$OUTPUT"

  # the venv pytest above never imports bpy
  blender:
    needs: zip
    strategy:
      fail-fast: false
      matrix:
        blender:
          - release: "4.3"
            version: 4.3.2
          - release: "5.2"
            version: 5.2.0
        platform:
          - os: ubuntu-latest
            arch: linux-x64
            archive: tar.xz
            tag: linux
            binary: blender
            suite: true
          - os: windows-latest
            arch: windows-x64
            archive: zip
            tag: windows
            binary: blender.exe
            suite: true
          # uv refuses macos (tool.uv.environments), so the bpy suite can't run there
          - os: macos-26-intel
            arch: macos-x64
            archive: dmg
            tag: macos-x64
            binary: Blender.app/Contents/MacOS/Blender
            suite: false
          - os: macos-26
            arch: macos-arm64
            archive: dmg
            tag: macos-arm64
            binary: Blender.app/Contents/MacOS/Blender
            suite: false
        # blender 5 has no intel mac build
        exclude:
          - blender:
              release: "5.2"
            platform:
              arch: macos-x64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BLENDER_DIR: blender-${{ matrix.blender.version }}-${{ matrix.platform.arch }}
      TAG: ${{ matrix.platform.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: matrix.platform.suite
      - run: uv sync
        if: matrix.platform.suite

      - name: Cache blender
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BLENDER_DIR }}
          key: ${{ env.BLENDER_DIR }}

      - name: Download blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        env:
          URL: https://download.blender.org/release/Blender${{ matrix.blender.release }}/${{ env.BLENDER_DIR }}.${{ matrix.platform.archive }}
        run: |
          if [ "${{ matrix.platform.archive }}" = "zip" ]; then
            curl -sSL -o blender.zip "$URL"
            unzip -q blender.zip
          elif [ "${{ matrix.platform.archive }}" = "dmg" ]; then
            curl -sSL -o blender.dmg "$URL"
            hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/blender-dmg" blender.dmg
            mkdir "$BLENDER_DIR"
            cp -R "$RUNNER_TEMP/blender-dmg/Blender.app" "$BLENDER_DIR/"
            hdiutil detach "$RUNNER_TEMP/blender-dmg"
          else
            curl -sSL "$URL" | tar xJ
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addon-zip

      # same zips and basename match as fetch_binary in the addon
      - name: Download the engines
        if: matrix.platform.suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXE: ${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
        run: |
          mkdir -p engine-builds/$TAG
          for ENGINE in optcuts xatlas; do
            CONSTANT="$(echo "$ENGINE" | tr a-z A-Z)_VERSION"
            VERSION=$(grep -m1 "^$CONSTANT = " src/engines/$ENGINE/install.py | cut -d'"' -f2)
            gh release download "$ENGINE-v$VERSION" --pattern "$ENGINE-engine-*-$TAG.zip" --dir package/$ENGINE
            mkdir -p extracted/$ENGINE
            unzip -q package/$ENGINE/*.zip -d extracted/$ENGINE
            cp "$(find extracted/$ENGINE -type f -name "$ENGINE$EXE")" engine-builds/$TAG/
            chmod +x "engine-builds/$TAG/$ENGINE$EXE"
          done
          for ENGINE in segment hardsurface; do
            unzip -q -j addon.zip "bin/$TAG/$ENGINE$EXE" -d engine-builds/$TAG
            chmod +x "engine-builds/$TAG/$ENGINE$EXE"
          done

      - name: Run the suite inside blender
        if: matrix.platform.suite
        env:
          BLENDER: ${{ github.workspace }}/${{ env.BLENDER_DIR }}/${{ matrix.platform.binary }}
        run: uv run python dev/tests/blender/run.py

      # validate only reads the manifest
      - name: Validate the manifest
        run: ${{ env.BLENDER_DIR }}/${{ matrix.platform.binary }} --factory-startup --command extension validate .

      # an empty user folder, like a first install
      - name: Install the zip
        run: |
          echo "BLENDER_USER_RESOURCES=$RUNNER_TEMP/blender-user" >> "$GITHUB_ENV"
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-user" ${{ env.BLENDER_DIR }}/${{ matrix.platform.binary }} --factory-startup --command extension install-file -r user_default -e addon.zip

      - name: Download the engines and unwrap a cube in the installed addon
        run: ${{ env.BLENDER_DIR }}/${{ matrix.platform.binary }} -b --python-exit-code 1 --python dev/tests/blender/installed_addon.py -- bl_ext.user_default.uvgami

